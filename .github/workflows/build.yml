name: Build Aainik Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required for Android build) ─────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # ── 3. Set up Flutter SDK ───────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      # ── 4. Install Flutter dependencies ────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 5. Verify Flutter setup ─────────────────────────────
      - name: Flutter doctor
        run: flutter doctor -v

      # ── 6. Build APK (debug — no signing key needed) ────────
      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      # ── 7. Upload APK as GitHub artifact ────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aainik-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── 8. Also build release APK (self-signed debug key) ───
      - name: Build release APK (debug signed)
        run: flutter build apk --release --no-shrink
        continue-on-error: true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aainik-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
        continue-on-error: true
